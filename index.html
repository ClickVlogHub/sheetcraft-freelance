<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel & Google Sheets Freelance Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 24px 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .card { background: #1e293b; width: 100%; max-width: 600px; border-radius: 20px; border: 1px solid #334155; padding: 28px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 800; color: #ffffff; }
    .header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-bottom: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; color: #ffffff; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; ring: 2px solid #3b82f6; }
    .service-btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .service-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; }
    .service-btn.active { background: #2563eb; color: #ffffff; border-color: #3b82f6; }
    .hidden { display: none; }
    .price-box { background: #0f172a; border: 1px solid #334155; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .price-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .price-value { font-size: 24px; font-weight: 800; color: #34d399; }
    .submit-btn { width: 100%; background: #10b981; color: #022c22; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; transition: background 0.2s; }
    .submit-btn:active { background: #059669; }
    @media(max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>📊 Spreadsheet Consultant</h1>
      <p>Excel & Google Sheets Freelance Services</p>
    </div>

    <form id="leadForm">
      
      <!-- Contact Info -->
      <div class="section-title">1. Your Details</div>
      <div class="grid-3">
        <input required type="text" id="name" placeholder="Aapka Naam">
        <input required type="email" id="email" placeholder="Email Address">
        <input required type="tel" id="phone" placeholder="WhatsApp Number">
      </div>

      <!-- Service Selection -->
      <div class="section-title">2. Service Required</div>
      <div class="service-btn-group">
        <div class="service-btn active" id="btn-excel" onclick="setService('excel')">📊 Excel</div>
        <div class="service-btn" id="btn-sheets" onclick="setService('sheets')">📑 Sheets</div>
        <div class="service-btn" id="btn-both" onclick="setService('both')">⚡ Both</div>
      </div>

      <!-- File & Link Input -->
      <div id="excelSection" style="margin-bottom: 18px;">
        <div class="section-title">3. Attach Excel File</div>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
      </div>

      <div id="sheetsSection" class="hidden" style="margin-bottom: 18px;">
        <div class="section-title">3. Google Sheets Share URL</div>
        <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/...">
      </div>

      <!-- Complexity & Delivery -->
      <div class="grid-2">
        <div>
          <div class="section-title">4. Task Complexity</div>
          <select id="complexity" onchange="calcPrice()">
            <option value="500">Basic (Cleaning / Formatting) - ₹500</option>
            <option value="1200" selected>Medium (Formulas, Pivot, Dashboard) - ₹1,200</option>
            <option value="2500">Advanced (Macros, VBA, Automation) - ₹2,500</option>
          </select>
        </div>
        <div>
          <div class="section-title">5. Delivery Timeline</div>
          <select id="delivery" onchange="calcPrice()">
            <option value="0" selected>Standard (2-3 Days)</option>
            <option value="500">Express (24 Hours) +₹500</option>
          </select>
        </div>
      </div>

      <!-- Description -->
      <div style="margin-bottom: 16px;">
        <div class="section-title">6. Work Instructions</div>
        <textarea required id="notes" rows="3" placeholder="Sheet me kya changes ya formula setup karwana hai..."></textarea>
      </div>

      <!-- Price Output -->
      <div class="price-box">
        <div>
          <div class="price-label">Estimated Price</div>
          <div class="price-value" id="priceDisplay">₹1,200</div>
        </div>
        <div style="font-size: 11px; color: #64748b; text-align: right;">Instant WhatsApp<br>Confirmation</div>
      </div>

      <button type="submit" class="submit-btn">WhatsApp Par Order Bhejein →</button>
    </form>
  </div>

  <script>
    // APNA WHATSAPP NUMBER YAHAN DALEIN (Country code 91 ke sath)
    const MY_PHONE = "919876543210";
    let selectedService = 'excel';

    function setService(type) {
      selectedService = type;
      document.querySelectorAll('.service-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');

      const excelSec = document.getElementById('excelSection');
      const sheetsSec = document.getElementById('sheetsSection');

      if (type === 'excel') {
        excelSec.classList.remove('hidden');
        sheetsSec.classList.add('hidden');
      } else if (type === 'sheets') {
        excelSec.classList.add('hidden');
        sheetsSec.classList.remove('hidden');
      } else {
        excelSec.classList.remove('hidden');
        sheetsSec.classList.remove('hidden');
      }
      calcPrice();
    }

    function calcPrice() {
      let cost = parseInt(document.getElementById('complexity').value);
      cost += parseInt(document.getElementById('delivery').value);
      if (selectedService === 'both') cost += 500;
      document.getElementById('priceDisplay').innerText = "₹" + cost.toLocaleString('en-IN');
      return cost;
    }

    document.getElementById('leadForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const notes = document.getElementById('notes').value;
      const sheetUrl = document.getElementById('sheetUrl').value;
      const fileInput = document.getElementById('excelFile');
      const fileName = fileInput.files[0] ? fileInput.files[0].name : '';
      const total = calcPrice();

      let msg = "*Naya Spreadsheet Work Request*\n\n";
      msg += "*Name:* " + name + "\n";
      msg += "*Phone:* " + phone + "\n";
      msg += "*Email:* " + email + "\n";
      msg += "*Service:* " + selectedService.toUpperCase() + "\n";
      if (sheetUrl) msg += "*Sheet Link:* " + sheetUrl + "\n";
      if (fileName) msg += "*File Name:* " + fileName + "\n";
      msg += "*Task Details:* " + notes + "\n\n";
      msg += "*Estimated Cost:* ₹" + total;

      window.open("https://wa.me/" + MY_PHONE + "?text=" + encodeURIComponent(msg), "_blank");
    });

    // Initial calc
    calcPrice();
  </script>
</body>
</html>
